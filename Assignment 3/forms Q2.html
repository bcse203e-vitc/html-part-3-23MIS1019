<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="/submit_registration" method="POST">
    <h2>Event Registration Form</h2>
    
 
    <label for="fullName">Full Name:</label><br>
    <input type="text" id="fullName" name="fullName" required><br><br>
    
    
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" required><br><br>
    
   
    <label for="phone">Phone Number:</label><br>
    <input type="tel" id="phone" name="phone" required><br><br>
    
    
    <label>Gender:</label><br>
    <input type="radio" id="genderMale" name="gender" value="Male" required>
    <label for="genderMale">Male</label><br>
    <input type="radio" id="genderFemale" name="gender" value="Female">
    <label for="genderFemale">Female</label><br>
    <input type="radio" id="genderOther" name="gender" value="Other">
    <label for="genderOther">Other</label><br><br>
    
   
    <label for="ageGroup">Age Group:</label><br>
    <select id="ageGroup" name="ageGroup" required>
      <option value="">Select your age group</option>
      <option value="Under 18">Under 18</option>
      <option value="18-25">18-25</option>
      <option value="26-35">26-35</option>
      <option value="36-45">36-45</option>
      <option value="46-60">46-60</option>
      <option value="60+">60+</option>
    </select><br><br>
    
  
    <label>Topics of Interest:</label><br>
    <input type="checkbox" id="topic1" name="topics" value="Technology">
    <label for="topic1">Technology</label><br>
    <input type="checkbox" id="topic2" name="topics" value="Health">
    <label for="topic2">Health</label><br>
    <input type="checkbox" id="topic3" name="topics" value="Education">
    <label for="topic3">Education</label><br>
    <input type="checkbox" id="topic4" name="topics" value="Business">
    <label for="topic4">Business</label><br>
    <input type="checkbox" id="topic5" name="topics" value="Arts">
    <label for="topic5">Arts</label><br><br>
    
   
    <label for="comments">Additional Comments:</label><br>
    <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Your comments..."></textarea><br><br>
    
    
    <button type="submit">Register</button>
  </form>
</body>
</html>
