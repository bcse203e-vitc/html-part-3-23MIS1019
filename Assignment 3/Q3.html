<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Schedule Table</title>
</head>
<body>
    <table border="1">
        <tr style="background-color: lightblue;">
            <th>Flight Number</th>
            <th>Destination</th>
            <th>Depature Time</th>
            <th>Arrival Time</th>
            <th>Duration</th>
            <th>status</th>
        </tr>
        <tr style="background-color: olive;">
            <td>FX873</td>
            <td>chicago</td>
            <td>10:00</td>
            <td>14:00</td>
            <td><abbr title="4 hours and 0 mins">4hr</abbr></td>
            <td>on time</td>
        </tr>
        <tr style="background-color: yellow">
            <td>JW429</td>
            <td>New York</td>
            <td>00:00</td>
            <td>06:00</td>
            <td><abbr title="6 hours and 0 mins">6hr</abbr></td>
            <td>on time</td>
        </tr>
    </table>
</body>
</html>
